# Screw joints into the six McMaster 94459A130 M3 heat-set inserts, checked by `cad-agent inserts cad/joints.yaml`
# (cad-agent v0.18.2, docs/inserts.md). Dimensions follow cad/parameters.json and ASSEMBLY.md. The material is the
# closest catalogued PETG (Bambu PETG Basic) to the Generic PETG in the slicer profile. Each insert sits 0.1 mm below
# its support face (inserts.recess_mm), so the screw's preload is carried by the knurl.
defaults: {material: petg-bambu-basic, head: socket, clearance_mm: 3.4, recess_mm: 0.1}
joints:
  # Lid: M3 x 20 through the lid counterbore (6.4 x 3.3) into the four PCB-support inserts. Under the head to the
  # insert face is 20 - 3.8 overlap - 0.1 recess = 16.1 mm of lid sleeve, foam washer and PCB; the check takes it as
  # printed PETG, the softest member. Screw tip 3.9 mm below the support face (1.2 mm above the pilot floor).
  - {name: lid, insert: mcmaster-94459A130, boss_outside_mm: 10.6, clamped: {thickness_mm: 16.1}, screw_depth_mm: 3.9}
  # Ribbon clamp: M3 x 6 into the two rear-chamber inserts. 6 - 3.6 overlap = 2.4 mm of clamp bar under the head.
  - {name: ribbon-clamp, insert: mcmaster-94459A130, boss_outside_mm: 9.2, clamped: {thickness_mm: 2.4},
     screw_depth_mm: 3.7}
