name: Design evidence and release packages
on:
  push:
    branches: [main]
    tags: ['rev*']
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned direct validation dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements-ci.txt
      - name: Check folder READMEs and committed design evidence
        run: |
          .venv/bin/python tools/write_readmes.py --check
          .venv/bin/python tools/validate_release.py
      - name: Build separated PCB and housing packages
        run: .venv/bin/python tools/package_release.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: thor-A0-engineering-packages
          path: |
            releases/*.zip
            releases/SHA256SUMS
            releases/manifest.json
            releases/release-notes.md
          retention-days: 30
  release:
    needs: check
    if: startsWith(github.ref, 'refs/tags/rev')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install validation dependencies and rebuild packages
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements-ci.txt
          .venv/bin/python tools/package_release.py
      - name: Publish engineering prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" releases/*.zip releases/SHA256SUMS releases/manifest.json --verify-tag --title "$TAG engineering prototype" --notes-file releases/release-notes.md --prerelease
